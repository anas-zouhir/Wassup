<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <!-- Wassup food: a frying pan seen from above, with the globe cooking in it.
       Pan cues (vs. a magnifying glass): thick wall, wide dark handle with a
       hanging hole, and a helper handle on the opposite side. -->
  <defs>
    <radialGradient id="ocean" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#6cc0f5" />
      <stop offset="0.55" stop-color="#2a82d4" />
      <stop offset="1" stop-color="#134c8c" />
    </radialGradient>
    <radialGradient id="shine" cx="32%" cy="26%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="shade" cx="40%" cy="35%" r="65%">
      <stop offset="0.7" stop-color="#000000" stop-opacity="0" />
      <stop offset="1" stop-color="#000000" stop-opacity="0.35" />
    </radialGradient>
    <clipPath id="sphere"><circle r="10" /></clipPath>
  </defs>

  <!-- Main handle, pointing down-left from the rim -->
  <g transform="translate(16.04 27.96) rotate(-45)">
    <path d="M3 -2.8L-13 -3.6A3.6 3.6 0 0 0 -13 3.6L3 2.8Z" fill="#262b34" stroke="#c9d1dc" stroke-width="1.4" stroke-linejoin="round" />
    <circle cx="-12.6" cy="0" r="1.4" fill="#05070d" stroke="#c9d1dc" stroke-width="0.8" />
  </g>

  <!-- Helper handle, opposite side -->
  <g transform="translate(37.96 6.04) rotate(-45)">
    <path d="M-1 -2.6H1.6A2.6 2.6 0 0 1 1.6 2.6H-1" fill="none" stroke="#c9d1dc" stroke-width="1.8" stroke-linecap="round" />
  </g>

  <!-- Pan: light rim, thick dark wall, cooking surface -->
  <circle cx="27" cy="17" r="15.5" fill="#3a414d" stroke="#0b0f18" stroke-width="3" />
  <circle cx="27" cy="17" r="15.5" fill="none" stroke="#c9d1dc" stroke-width="2" />
  <circle cx="27" cy="17" r="12" fill="#161a21" />

  <!-- Globe (drawn on a radius-10 sphere, then scaled into place) -->
  <g transform="translate(27 17) scale(0.96)">
    <circle r="10" fill="url(#ocean)" />
    <g clip-path="url(#sphere)" stroke-linejoin="round">
      <g fill="#55b04f" stroke="#3f8f3c" stroke-width="0.35">
        <path d="M-11 -9L-7.5 -9.3L-5.2 -8L-5.6 -6.4L-4.4 -5.6L-5.6 -4.2L-6.8 -3.6L-7.4 -2.2L-8.6 -1.4L-11 -2Z" />
        <path d="M-4.2 -9.4L-1.8 -9.8L-1 -8.6L-2.2 -7.4L-3.6 -7.6Z" />
        <path d="M-7.6 0.4L-5.4 0.2L-3.4 1.6L-2.8 3L-4.2 4.6L-5.2 6.8L-6.2 9.4L-7.2 9.6L-7 6.4L-8.2 3.6L-8.4 1.6Z" />
        <path d="M0.6 -4.4L0.2 -5.4L1.2 -6.2L2.4 -6L3.2 -7.6L5 -8.6L7 -8.2L8.8 -6.6L9 -4.8L7 -4.4L5.6 -3.6L4.4 -4L3.4 -3.4L2.2 -4Z" />
        <path d="M0.4 -2.6L2 -3.2L4.4 -2.8L6 -2.4L6.8 -1L8.2 0.4L7.4 1.4L6.6 3L6 5.2L4.8 7.4L3.8 8L3 6.6L2.8 4.4L2 2.6L0.6 2L-0.6 1.2L-1 -0.6Z" />
        <path d="M7 -2.6L9.4 -2.4L10.4 -0.4L8.6 0.6L7.6 -0.6Z" />
      </g>
      <g fill="#d8b46a">
        <path d="M0.4 -2.2L2.2 -2.8L4.6 -2.4L6 -2L6.4 -0.8L4.6 0L2.6 -0.2L0.6 0.2L-0.6 -0.4Z" />
        <path d="M7.4 -2.2L9.2 -2L9.8 -0.6L8.4 0L7.8 -0.8Z" />
      </g>
      <g fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="0.3">
        <ellipse rx="4.4" ry="10" />
        <path d="M-10 0H10M-9.2 -4.2Q0 -2.6 9.2 -4.2M-9.2 4.2Q0 5.8 9.2 4.2" />
      </g>
    </g>
    <circle r="10" fill="url(#shade)" />
    <circle r="10" fill="url(#shine)" />
    <circle r="10" fill="none" stroke="#0e3a6b" stroke-width="0.5" />
  </g>
</svg>
