name: Deploy

# Builds the site and publishes it to GitHub Pages. Twice a day it first
# refreshes the news (scripts/fetch-news.ts) and commits the new data back.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *' # morning (UTC)
    - cron: '0 18 * * *' # evening (UTC)
  workflow_dispatch:

permissions:
  contents: write # commit refreshed news data
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Fetch news
        if: github.event_name != 'push'
        # A failed refresh (e.g. too many feeds down) shouldn't block the deploy:
        # the site is then published with the previous headlines.
        continue-on-error: true
        run: npm run fetch-news

      - name: Commit news data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "No news changes."
          else
            git commit -m "Update news data"
            git pull --rebase
            git push
          fi

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
